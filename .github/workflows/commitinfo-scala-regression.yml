name: Delta CommitInfo Scala regression
on:
  push:
    branches:
      - ci-delta-metrics-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CommitInfoSerializerSuite (Spark 4.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SPARK_VERSION: '4.0'
    steps:
      - name: Checkout proposed PR changes
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.9'

      - name: Prepare Spark environment
        uses: ./.github/actions/prepare-spark-env
        with:
          spark-version: '4.0'

      - name: Restore SBT dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.sbt
            ~/.ivy2
            ~/.cache/coursier
          key: delta-sbt-cache-spark4.0-scala2.13.16

      - name: Prepare pinned Unity Catalog
        uses: ./.github/actions/setup-unitycatalog

      - name: Run CommitInfo Scala regression suite
        run: build/sbt -DsparkVersion=4.0 "spark/testOnly org.apache.spark.sql.delta.CommitInfoSerializerSuite"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delta-commitinfo-scala-reports
          path: '**/target/test-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7
